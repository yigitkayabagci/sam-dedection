# EdgeTAM at 512x512, image encoder adapted on static aerial instances with LoRA.
#
# Byte-for-byte configs/edgetam_512_aerial.yaml except for the checkpoint path,
# and that is the whole point: LoRA's adapters are merged into the base weights
# before the checkpoint is written, so what lands here is an ordinary EdgeTAM
# state dict. Same tracker, same exporter, same engines, same evaluation
# command -- the only difference between this config and the fine-tuned one is
# how the weights were arrived at.
#
# Produce it with:
#   python tools/train_encoder.py --method lora --lora-r 16 --data <root> \
#       --spec kust4k --out checkpoints/edgetam_aerial_lora_512.pt
#
# Compare against configs/edgetam_512_aerial.yaml (the partial fine-tune) and
# configs/edgetam_512.yaml (the stock checkpoint at the same resolution).
# notebooks/07_encoder_aerial_rgbt.ipynb runs all three on the held-out split.
model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_aerial_lora_512.pt
image_size: 512                           # overrides the Hydra config's 1024
device: cuda
precision: bfloat16                       # bfloat16 | float16 | float32
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight
