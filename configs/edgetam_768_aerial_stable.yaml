# EdgeTAM at 768x768 with 32_aerial_thermal_stage_b_stable.ipynb's checkpoint --
# WHICH WAS TRAINED AT 512. Read the next paragraph before using any number
# this produces.
#
# NO RETRAINING IS NEEDED TO RUN HERE, AND THAT IS THE PROBLEM. EdgeTAM keeps no
# resolution in any parameter: the trunk and neck are fully convolutional and
# the positional encodings are computed per frame, so the same 982 keys load at
# 512, 768 and 1024 under `strict=True` with no error and no PyTorch warning.
# The one table that does not self-adjust is the memory attention's
# cross-attention RoPE, and `src/trackers/_hydra_overrides.py` keeps it in
# lockstep with `image_size // backbone_stride` (48*48 = 2304 here). So nothing
# breaks -- and the only symptom of running off the training size is a model
# that quietly scores worse. src/checkpoint_meta.py prints a line about it at
# startup, wired into the tracker and the ONNX exporter both.
#
# WHAT THIS CONFIG MEASURES, AND WHAT IT DOES NOT. Against
# configs/edgetam_768.yaml (stock weights, same size) this is a fair A/B and
# answers "did 32's training help at 768". Against 32's own before/after table,
# or against configs/edgetam_512_aerial_stable.yaml, it answers nothing -- the
# resolution changed too. If the question is "did the training help", take it
# at 512, where the training happened.
#
# WHETHER 768 IS THE RIGHT SIZE IS A QUESTION ABOUT YOUR FOOTAGE, NOT ABOUT
# THESE WEIGHTS. 768 is the midpoint for sources carrying more than 512x512 of
# real detail -- this project's recordings are 1280x768, so `crop768` takes a
# native 768 window with no resampling. On a 640x512 thermal frame it *upsamples*:
# 2.25x the 512 token count (2304 against 1024) spent on interpolated pixels
# carrying no new information, and a 6-pixel drone reaches 9 pixels, still
# inside a single stride-16 cell. `src/trackers/adaptive.py` buys 4-10x
# magnification at the 512 price and is the right tool there. Measure it before
# committing: run this against configs/edgetam_512_aerial_stable.yaml on your
# own clips and read whether anything moved.
#
# IF 768 IS THE PERMANENT DEPLOYMENT SIZE, TRAINING THERE IS THE CLEAN FIX --
# `tools/train_encoder.py --size 768`, which is the same recipe with a bigger
# window (2.25x the pixels per sample, so a smaller measured batch). That is a
# new run and a new checkpoint, not something this file can stand in for. It is
# worth doing only once the paragraph above has been answered with a
# measurement: a source that does not carry 768x768 of detail will not pay for
# it at training time either.
#
# 768 itself is a sound size -- 768 = 3 * 2^8 and 768/16 = 48, so every stride-2
# stage lands exactly. See configs/edgetam_768.yaml for that derivation in full.
# None of it is in question here; only the checkpoint's training size is.
#
# THE MEMORY PATH IS STOCK, as in every stage B config: image_loop.py trains
# with no memory bank, so tracking quality was never what the notebook scored.
#
# TensorRT at this size: configs/edgetam_trt_768_aerial_stable.yaml, and the
# engines have to be exported from *this* checkpoint at *this* size -- see that
# file.
model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_pool_aerial_thermal_stable_512.pt
image_size: 768                           # NOT the size this checkpoint trained at
device: cuda
precision: bfloat16                       # bfloat16 | float16 | float32
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight
