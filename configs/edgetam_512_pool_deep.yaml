# EdgeTAM at 512x512, image encoder trained by notebooks/22_thermal_deep.ipynb.
#
# This is the deployment config for the *deep* thermal stage B, and it is a
# different run from the one configs/edgetam_512_pool.yaml points at:
#
#   19_thermal_stage_b_pool.ipynb   6 epochs of the head, neck and trunk frozen
#                                   at the shipped rate table, 400 steps
#   22_thermal_deep.ipynb           1 + 6 epochs, 800 steps, and the rate table
#                                   inverted -- LR_NECK = LR_TRUNK = 1e-4, so
#                                   the trunk leads the head instead of being
#                                   held back by it
#
# 22 does that because a modality shift lives in the trunk, and the reason the
# shipped table holds the trunk back -- a training set too small for the
# features it carries -- is weaker once every thermal pool 13-18 produced is
# required to be present. It also thins the vehicle classes (car 0.5, truck /
# van / feright_car 0.7) so DroneVehicle's car count does not decide the loss.
# Whether the inversion paid is a measurement in that notebook's own
# before/after table, not something this file can assert.
#
# 512 IS THE TRAINING RESOLUTION AND THIS IS THE HONEST COMPARISON. Score this
# against configs/edgetam_512.yaml -- stock weights, same size. Anything else
# mixes the training with a resolution change. src/checkpoint_meta.py now warns
# when a checkpoint is run off the size it recorded, but a warning at startup
# is not a substitute for choosing the right baseline.
#
# THE MEMORY PATH IS STOCK. Stage B never trains it -- src/training/image_loop.py
# runs with no memory bank at all -- so the notebook's numbers are one prompted
# frame each and say nothing about tracking. Expect a better first mask and
# re-measure the track.
#
# GET THE CHECKPOINT off your Drive: 22 mirrors it to
# MyDrive/edgetam-stage-b/thermal_deep/edgetam_pool_thermal_deep_512.pt along
# with run.json, verdict.json and the score_*.json rows. Put it under
# checkpoints/ here (that directory is gitignored -- weights never enter the
# repository).
#
# For the LoRA A/B (23_thermal_deep_lora.ipynb) point `checkpoint` at
# checkpoints/edgetam_pool_thermal_deep_lora_512.pt from
# MyDrive/edgetam-stage-b/thermal_deep_lora/ instead. The adapters are merged
# before the file is written, so it is the same 982-key state dict and needs no
# other change here.
#
# Then re-export and rebuild engines -- weights live inside an engine, so a new
# checkpoint means a new export, not just a new YAML:
#   python tools/export_edgetam_onnx.py --outdir models512_pool_deep/ --image-size 512 \
#       --checkpoint checkpoints/edgetam_pool_thermal_deep_512.pt --verify
#   python tools/build_trt_engines.py --outdir models512_pool_deep/ --max-batch 4
# and run them with configs/edgetam_trt_512_pool_deep.yaml.
model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_pool_thermal_deep_512.pt
image_size: 512                           # the size 22 trained at -- see above
device: cuda
precision: bfloat16                       # bfloat16 | float16 | float32
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight
