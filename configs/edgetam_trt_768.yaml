# EdgeTAM on TensorRT at 768x768. See configs/edgetam_768.yaml for why 768 is
# a valid size at all and when it is the wrong one.
#
# Engines are shape-specific: a 512 or 1024 engine cannot run a 768 graph.
# Build these into their own directory so no set overwrites another.
#
# Build ON THE ORIN:
#   1) python tools/export_edgetam_onnx.py --outdir models768/ --image-size 768 --verify
#   2) python tools/build_trt_engines.py   --outdir models768/ --max-batch 4
#   3) python tools/check_trt_parity.py    --outdir models768/ --image-size 768
#   4) python tools/run_experiment.py --outdir results/768 --engines models768/ \
#          --config configs/edgetam_trt_768.yaml \
#          --baseline-config configs/edgetam_768.yaml --image-size 768
#
# Step 1 is also the correctness check for the resolution itself, and it fails
# loudly rather than silently: `_CrossAttentionGraph.__init__` compares the
# memory attention's precomputed query RoPE table against the actual feature
# map and raises "Query RoPE table covers N tokens but the feature map has M"
# when they disagree. At 768 both must read 2304. `--verify` then runs every
# graph through onnxruntime and asserts parity with PyTorch, so a trunk or neck
# that did not like the size shows up here and not on the recording.
#
# Compare against configs/edgetam_768.yaml, not the 512 or 1024 baselines --
# the baseline has to run at the same resolution or the comparison measures the
# resolution change instead of TensorRT.
image_encoder_engine:    models768/edgetam_image_encoder.engine
memory_attention_engine: models768/edgetam_memory_attention.engine
memory_encoder_engine:   models768/edgetam_memory_encoder.engine
sam_head_engine:         models768/edgetam_sam_head.engine

model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: third_party/EdgeTAM/checkpoints/edgetam.pt
image_size: 768                           # must match how the engines were exported
device: cuda
precision: float16                        # matches the fp16 engines
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight

strict: false                             # true = refuse silent PyTorch fallback
use_cuda_graph: true                      # replay engines from a captured graph
# null  -> keep EdgeTAM's default (8), but disable it automatically when the
#          sam2._C extension is missing, since it would raise every frame.
# 0     -> off. Any int -> that hole area.
fill_hole_area: null
