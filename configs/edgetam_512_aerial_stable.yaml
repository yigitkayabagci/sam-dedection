# EdgeTAM at 512x512, image encoder trained by
# notebooks/32_aerial_thermal_stage_b_stable.ipynb.
#
# This is the deployment config for the *stable* aerial thermal stage B, and it
# is a third run beside the two already here:
#
#   19_thermal_stage_b_pool.ipynb   6 epochs at the shipped rate table, 400 steps
#   22_thermal_deep.ipynb           1 + 6 epochs, 800 steps, the rate table
#                                   inverted so the trunk leads the head
#   32_aerial_thermal_stage_b_...   2 + 12 epochs, 500 steps, and the thing 22's
#                                   recorded run did not survive
#
# WHY 32 EXISTS. The Drive `thermal_deep/run.json` from 22 went head validation
# loss 0.2723, then 21.84 once the encoder opened, then NaN -- so the file it
# saved is a head-stage checkpoint, not the deep run it is named after. That run
# used batch 128 with `--lr-scale 4` on top of an already inverted table. 32
# pins `--lr-scale 1` so the rates are what the table says whatever batch the
# probe measures, opens the trunk at the slowest rate of the three, and runs a
# 150-step pilot over `cautious` / `stable` / `thermal` on the same split before
# spending the full cycle. Which profile it picked is in that run's own
# `run.json`; this file cannot assert it.
#
# It also makes VTUAV-LT mandatory (5 000 accepted instances at least) and
# trains under low-contrast, polarity, gamma and sensor-noise hardening, which
# is the distribution an aerial thermal camera actually produces and the one
# 29-31 go on to measure on video.
#
# 512 IS THE TRAINING RESOLUTION AND THIS IS THE HONEST COMPARISON. Score this
# against configs/edgetam_512.yaml -- stock weights, same size. Anything else
# mixes the training with a resolution change. src/checkpoint_meta.py warns when
# a checkpoint is run off the size it recorded, but a warning at startup is not
# a substitute for choosing the right baseline. There is deliberately no 768
# twin of this file: 22 has one because that run was taken off its size on
# purpose and said so; nothing here has asked that question yet.
#
# THE MEMORY PATH IS STOCK. Stage B never trains it -- src/training/image_loop.py
# runs with no memory bank at all -- so the notebook's numbers are one prompted
# frame each and say nothing about tracking. Expect a better first mask and
# re-measure the track. That measurement is 29/30/31, which read this very
# checkpoint off Drive.
#
# GET THE CHECKPOINT off your Drive: 32 mirrors it to
# MyDrive/edgetam-stage-b/aerial_thermal_stable/edgetam_pool_aerial_thermal_stable_512.pt
# along with run.json, verdict.json and the score_*.json rows. Put it under
# checkpoints/ here (that directory is gitignored -- weights never enter the
# repository).
#
# Then re-export and rebuild engines -- weights live inside an engine, so a new
# checkpoint means a new export, not just a new YAML:
#   python tools/export_edgetam_onnx.py --outdir models512_aerial_stable/ --image-size 512 \
#       --checkpoint checkpoints/edgetam_pool_aerial_thermal_stable_512.pt \
#       --all-pointers --verify
#   python tools/build_trt_engines.py --outdir models512_aerial_stable/ --max-batch 4
# and run them with configs/edgetam_trt_512_aerial_stable.yaml.
model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_pool_aerial_thermal_stable_512.pt
image_size: 512                           # the size 32 trained at -- see above
device: cuda
precision: bfloat16                       # bfloat16 | float16 | float32
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight
