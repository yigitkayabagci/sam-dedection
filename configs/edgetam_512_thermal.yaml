# EdgeTAM at 512x512, fine-tuned on Anti-UAV410 thermal footage.
#
# Identical to configs/edgetam_512.yaml except for the checkpoint. That is the
# point: the fine-tune changes weights and nothing else, so the ONNX export,
# the engine build, check_trt_parity.py and compare_backends.py all keep
# working with no change at all.
#
# Produce the checkpoint with notebooks/02_finetune_edgetam_512_thermal.ipynb,
# then re-export and rebuild engines on the Orin:
#   python tools/export_edgetam_onnx.py --outdir models512_ft/ --image-size 512 \
#       --checkpoint checkpoints/edgetam_thermal_512.pt --verify
#   python tools/build_trt_engines.py --outdir models512_ft/ --max-batch 4
#
# Compare against configs/edgetam_512.yaml (the stock checkpoint at the same
# resolution), never against the 1024 config -- otherwise the measurement is of
# the resolution change rather than of the fine-tune.
model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_thermal_512.pt
image_size: 512                           # overrides the Hydra config's 1024
device: cuda
precision: bfloat16                       # bfloat16 | float16 | float32
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight
