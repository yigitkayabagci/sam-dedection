# EdgeTAM on TensorRT at 512x512 instead of the checkpoint's native 1024.
#
# Engines are shape-specific: a 1024 engine cannot run a 512 graph. Build these
# into their own directory so they never overwrite the 1024 set.
#
# Build ON THE ORIN:
#   1) python tools/export_edgetam_onnx.py --outdir models512/ --image-size 512 --verify
#   2) python tools/build_trt_engines.py   --outdir models512/ --max-batch 4
#   3) python tools/check_trt_parity.py    --outdir models512/ --image-size 512
#   4) python tools/run_experiment.py --outdir results/512 --engines models512/ \
#          --config configs/edgetam_trt_512.yaml \
#          --baseline-config configs/edgetam_512.yaml --image-size 512
#
# Compare against configs/edgetam_512.yaml, not configs/edgetam.yaml -- the
# baseline has to run at the same resolution or the comparison measures the
# resolution change instead of TensorRT.
image_encoder_engine:    models512/edgetam_image_encoder.engine
memory_attention_engine: models512/edgetam_memory_attention.engine
memory_encoder_engine:   models512/edgetam_memory_encoder.engine
sam_head_engine:         models512/edgetam_sam_head.engine

model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: third_party/EdgeTAM/checkpoints/edgetam.pt
image_size: 512                           # must match how the engines were exported
device: cuda
precision: float16                        # matches the fp16 engines
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight

strict: false                             # true = refuse silent PyTorch fallback
use_cuda_graph: true                      # replay engines from a captured graph
# null  -> keep EdgeTAM's default (8), but disable it automatically when the
#          sam2._C extension is missing, since it would raise every frame.
# 0     -> off. Any int -> that hole area.
fill_hole_area: null
