# 22_thermal_deep.ipynb's checkpoint on TensorRT at 512x512 -- its training
# resolution. See configs/edgetam_512_pool_deep.yaml for what that run was.
#
# A NEW CHECKPOINT MEANS A NEW EXPORT. Weights are traced into the ONNX graphs
# and baked into the engines built from them; there is no runtime checkpoint
# load on the TensorRT path. Pointing an existing models512/ engine set at a
# new `checkpoint:` here changes nothing about what runs -- the `checkpoint`
# key below feeds the PyTorch modules that back the engines (the fallback path,
# the memory bookkeeping that never left PyTorch, and the parity check), not
# the engines themselves. Build these into their own directory:
#
#   1) python tools/export_edgetam_onnx.py --outdir models512_pool_deep/ \
#          --image-size 512 \
#          --checkpoint checkpoints/edgetam_pool_thermal_deep_512.pt --verify
#   2) python tools/build_trt_engines.py   --outdir models512_pool_deep/ --max-batch 4
#   3) python tools/check_trt_parity.py    --outdir models512_pool_deep/ \
#          --image-size 512 --checkpoint checkpoints/edgetam_pool_thermal_deep_512.pt
#      (--checkpoint is NOT optional here: it defaults to the stock
#      edgetam.pt, and parity against the wrong weights fails every
#      module for a reason that has nothing to do with TensorRT.)
#   4) python tools/run_experiment.py --outdir results/512_pool_deep \
#          --engines models512_pool_deep/ \
#          --config configs/edgetam_trt_512_pool_deep.yaml \
#          --baseline-config configs/edgetam_512_pool_deep.yaml --image-size 512
#
# Step 4's baseline is the PyTorch run of the *same* weights at the *same*
# size, which is what makes the result "what TensorRT changed". Two other
# comparisons are worth taking and are different questions:
#
#   configs/edgetam_trt_512.yaml        stock weights, TensorRT, 512
#                                       -> what the training changed on device
#   configs/edgetam_512_pool_deep.yaml  same weights, PyTorch, 512
#                                       -> what TensorRT changed (step 4 above)
#
# Never score this against numbers taken at 768 or 1024.
image_encoder_engine:    models512_pool_deep/edgetam_image_encoder.engine
memory_attention_engine: models512_pool_deep/edgetam_memory_attention.engine
memory_encoder_engine:   models512_pool_deep/edgetam_memory_encoder.engine
sam_head_engine:         models512_pool_deep/edgetam_sam_head.engine

model_cfg: configs/edgetam.yaml           # Hydra config name (sam2 package)
checkpoint: checkpoints/edgetam_pool_thermal_deep_512.pt
image_size: 512                           # must match how the engines were exported
device: cuda
precision: float16                        # matches the fp16 engines
mask_threshold: 0.0
offload_video_to_cpu: false               # set true for very long videos
offload_state_to_cpu: false               # set true if GPU memory is tight

strict: false                             # true = refuse silent PyTorch fallback
use_cuda_graph: true                      # replay engines from a captured graph
# null  -> keep EdgeTAM's default (8), but disable it automatically when the
#          sam2._C extension is missing, since it would raise every frame.
# 0     -> off. Any int -> that hole area.
fill_hole_area: null
